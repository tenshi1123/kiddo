name: kiddo
description: "kiddo english"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.4+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.1
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.2
  intl: ^0.20.2
  path_provider: ^2.1.4
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.14.0
  url_launcher: ^6.3.0
  flutter_widget_from_html_core: ^0.17.0
  number_paginator: ^1.1.0
  camera_camera: ^3.0.0
  image_picker: ^1.1.2
  persistent_bottom_nav_bar_v2: ^6.0.1
  upgrader: ^11.3.1
  smooth_page_indicator: ^1.2.1
  buttons_tabbar: ^1.3.15
  dio: ^5.8.0+1
  sp_util: ^2.0.3
  crypto: ^3.0.6
  flutter_bloc: ^9.1.0
  file_picker: ^10.0.0
  flutter_html:  ^3.0.0-alpha.6
  audio_video_progress_bar: ^2.0.3
  onesignal_flutter: ^5.1.2
  screenshot: ^3.0.0
  dotted_border: ^2.0.0
  permission_handler: ^12.0.1
  gal: ^2.3.2
  flutter_downloader: ^1.12.0
  flutter_bunny_video_player: ^1.0.8
  firebase_core: ^4.2.0
  flutter_localizations:
    sdk: flutter
  #flutter_bunny_video_player_ios: ^1.0.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
  - family: Montserrat
    fonts:
      - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
      - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
        style: italic
  - family: MontserratBold
    fonts:
      - asset: assets/fonts/Montserrat-Bold.ttf
  - family: MontserratRegular
    fonts:
      - asset: assets/fonts/Montserrat-Regular.ttf
  - family: MontserratMedium
    fonts:
      - asset: assets/fonts/Montserrat-Medium.ttf
  - family: MontserratSemiBold
    fonts:
      - asset: assets/fonts/Montserrat-SemiBold.ttf
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/